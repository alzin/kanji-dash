# Not a plain `gcloud builds submit --tag`, so `logging: CLOUD_LOGGING_ONLY` applies:
# default build logs go to a bucket only a project Viewer/Owner can read, and gcloud
# then fails the command even though the build succeeds. cloudbuild.web.yaml does the same.
substitutions:
  _REGION: asia-southeast1
  _REPO: kanji-quest
  _TAG: bootstrap
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:${_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:${_TAG}
options:
  logging: CLOUD_LOGGING_ONLY
